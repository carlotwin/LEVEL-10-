<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Level 10 SMS Outreach</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="logo">Twin Home Buyer</div>
        <div class="sub">Level 10 SMS Outreach</div>
      </div>
      <div id="modePill" class="pill-mode">Test Mode</div>
    </header>

    <div id="note" class="note"></div>

    <main>
      <!-- Step 1: data + run -->
      <section class="card">
        <div class="card-head">
          <h2>Campaign</h2>
          <span id="runStatus" class="status">idle</span>
        </div>

        <div class="run-row">
          <button id="btnStart" class="btn primary" disabled>Start</button>
          <button id="btnPause" class="btn" disabled>Pause</button>
          <button id="btnResume" class="btn" disabled>Resume</button>
          <button id="btnStop" class="btn ghost" disabled>Stop</button>
        </div>
        <div class="progress-wrap">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="progressText" class="muted small"></div>

        <details class="data">
          <summary>Load leads &amp; ProfitDial data</summary>
          <div class="data-body">
            <button id="btnLoadSample" class="btn">Load sample leads</button>
            <label class="file">Upload leads (.csv/.xlsx)<input type="file" id="contactFile" accept=".csv,.xlsx,.xls" /></label>
            <label class="file">ProfitDial sheet (.xlsx)<input type="file" id="pdFile" accept=".xlsx,.xls,.csv" /></label>
            <div class="gs">
              <input type="text" id="gsUrl" class="txt" placeholder="…or paste a Google Sheet link for ProfitDial" />
              <button id="btnGoogleSheet" class="btn">Load</button>
            </div>
            <div id="loadInfo" class="muted small"></div>
          </div>
        </details>
      </section>

      <!-- Step 2: the numbers that matter -->
      <section class="card">
        <div class="card-head">
          <h2>Results at a glance</h2>
          <div class="exports">
            <button id="btnPrint" class="btn small primary">Print daily report</button>
            <a id="exportXlsx" class="btn small" href="/api/export?format=xlsx">Export Excel</a>
            <a id="exportCsv" class="btn small ghost" href="/api/export?format=csv">Export CSV</a>
          </div>
        </div>
        <div id="kpi" class="kpi"></div>
      </section>

      <!-- Step 3: template performance -->
      <section class="card">
        <div class="card-head"><h2>Which message works best</h2><span id="bestTemplate" class="best"></span></div>
        <div class="table-wrap">
          <table class="tbl" id="templateTable">
            <thead><tr><th>Message</th><th>Sent</th><th>Delivered</th><th>Replies</th><th>Positive</th><th>Opt-outs</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- Step 4: per-lead outcomes -->
      <section class="card">
        <div class="card-head"><h2>Leads</h2><span id="reviewCount" class="muted small"></span></div>
        <div class="table-wrap tall">
          <table class="tbl" id="resultsTable">
            <thead><tr><th></th><th>Name</th><th>Phone</th><th>Outcome</th><th>Message</th><th>Reply</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
